# My kitty customizations — loaded AFTER the dots-hyprland base config.
# Later settings override earlier ones, so anything here takes priority.

shell zsh

# cursor_text_color is kitty-specific (not set by dots-hyprland sequences.txt)
cursor_text_color     #F2F5F0

# Send the kitty keyboard protocol sequence for Shift+Enter explicitly.
# Needed because protocol negotiation breaks through the tmux layer.
map shift+enter send_text all \x1b[13;2u
